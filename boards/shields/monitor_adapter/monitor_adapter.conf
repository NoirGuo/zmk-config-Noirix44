# SPDX-License-Identifier: MIT

CONFIG_BT=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_CENTRAL=n
CONFIG_ZMK_SPLIT=n
CONFIG_ZMK_USB=n
CONFIG_ZMK_BLE=n

CONFIG_ZMK_DISPLAY=y
CONFIG_DISPLAY=y
CONFIG_LVGL=y
CONFIG_SSD1306=y
CONFIG_SPI=y
CONFIG_I2C=y
CONFIG_SETTINGS=y
CONFIG_ZMK_BATTERY=n
CONFIG_ZMK_EXT_POWER=n
CONFIG_ZMK_DONGLE_MONITOR=y
CONFIG_ZMK_DONGLE_MONITOR_CHANNEL=1

# The scanner has no physical keys or keymap to edit in ZMK Studio.
# Keep its display settings local to firmware; Studio requires a physical layout.
CONFIG_ZMK_CUSTOM_SETTINGS=y
CONFIG_ZMK_CUSTOM_SETTINGS_LARGE_VALUE_MAX_SIZE=256
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
